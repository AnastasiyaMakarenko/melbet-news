name: probe-html
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python tools/probe_html.py "${{ inputs.url }}"
        env:
          OPENROUTER_API_KEY: not-used
