name: restyle

# Разово: переписать опубликованные новости в новом стиле (адреса, даты и картинки не меняются; ~30 центов)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/restyle.py
        env:
          PYTHONPATH: tools
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXT_MODEL: openai/gpt-4.1-mini
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data
          git commit -m "restyle published news" || exit 0
          git pull --rebase
          git push
      - run: python upload.py
        env:
          R2_BUCKET: mb-news
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
