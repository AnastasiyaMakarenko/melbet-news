name: update-news

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # модели можно поменять тут — точные названия смотри на openrouter.ai/models
          TEXT_MODEL: openai/gpt-4.1-mini
          IMAGE_MODEL: openai/gpt-5-image-mini
          # сколько новостей публиковать за запуск (раз в 10 мин): 1 = до 144 в сутки. Главный рычаг стоимости
          MAX_NEW: "1"
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data
          git commit -m "news update" || exit 0
          git push
