name: fetch-sources

# БЕСПЛАТНО: найти и скачать исходники для опубликованных новостей (нейронка не используется).
# Результат — временный файл запуска на 1 день, в репозиторий не попадает.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "JSON: {id новости: [[ключевые слова], ...]}"
        default: "{}"
      links:
        description: "JSON: {ключ: [url, ...]} — скачать именно эти страницы"
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/fetch_sources.py
        env:
          PYTHONPATH: tools
          OPENROUTER_API_KEY: not-used
          KEYS: ${{ inputs.keys }}
          LINKS: ${{ inputs.links }}
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: sources_dump.json
          retention-days: 1
