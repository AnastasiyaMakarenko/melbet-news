name: compare-images

# Разово: картинки одних и тех же новостей от нескольких моделей — для выбора (тратит OpenRouter, ~50 центов)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/compare_images.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXT_MODEL: openai/gpt-4.1-mini
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data/compare
          git commit -m "compare image models" || exit 0
          git pull --rebase
          git push
